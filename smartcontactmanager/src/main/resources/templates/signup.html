<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: layout(~{::section})}">
  <body>
    <section class="page-section auth-section">
      <div class="container auth-container">
        <div class="surface-card auth-card">
          <span class="eyebrow">Start your contact book</span>
          <h1 class="page-title">Create your account.</h1>
          <p class="text-secondary mb-4">A few details and you're ready to go.</p>

          <form th:action="@{/do_register}" method="post" th:object="${user}">
            <div class="alert alert-danger" role="alert" th:if="${#fields.hasGlobalErrors()}">
              <p class="mb-0" th:each="error : ${#fields.globalErrors()}" th:text="${error}"></p>
            </div>
            <div class="mb-3">
              <label for="name-field" class="form-label">Your name</label>
              <input
                type="text"
                class="form-control"
                th:field="*{name}"
                th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''"
                id="name-field"
                autocomplete="name"
                required
              />
              <div class="invalid-feedback" th:errors="*{name}"></div>
            </div>
            <div class="mb-3">
              <label for="email-field" class="form-label">Email address</label>
              <input
                type="email"
                class="form-control"
                th:field="*{email}"
                th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"
                id="email-field"
                autocomplete="email"
                required
              />
              <div class="invalid-feedback" th:errors="*{email}"></div>
            </div>
            <div class="mb-3">
              <label for="password-field" class="form-label">Password</label>
              <input
                type="password"
                class="form-control"
                th:field="*{password}"
                th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''"
                id="password-field"
                autocomplete="new-password"
                aria-describedby="password-help"
                required
              />
              <div id="password-help" class="form-text">Use at least 10 characters.</div>
              <div class="invalid-feedback" th:errors="*{password}"></div>
            </div>
            <div class="mb-3">
              <label for="about-field" class="form-label">A little about you</label>
              <textarea
                class="form-control"
                th:field="*{about}"
                th:classappend="${#fields.hasErrors('about')} ? 'is-invalid' : ''"
                id="about-field"
                rows="3"
                maxlength="500"
                required
              ></textarea>
              <div class="invalid-feedback" th:errors="*{about}"></div>
            </div>
            <div class="form-check mb-4">
              <input class="form-check-input" type="checkbox" name="agreement" id="agreement" required />
              <label class="form-check-label" for="agreement">
                I agree to the terms of use.
              </label>
            </div>
            <button type="submit" class="btn btn-primary w-100">Create account</button>
          </form>
          <p class="text-secondary text-center mt-4 mb-0">
            Already have an account? <a th:href="@{/login}">Sign in</a>
          </p>
        </div>
      </div>
    </section>
  </body>
</html>
