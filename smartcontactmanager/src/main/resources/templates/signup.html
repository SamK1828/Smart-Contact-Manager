<!DOCTYPE html>
<html
  lang="en"
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{base::layout(~{::section})}"
>
  <head>
    <meta charset="UTF-8" />
    <title>Smart Contact Manager</title>
  </head>
  <body>
    <section>
      <div class="container my-2">
        <div class="row">
          <div class="col-12 col-md-6 offset-md-3 mx-auto">
            <div class="my-card mb-2">
              <div class="alert alert-primary" role="alert">
                This is a primary alert—check it out!
              </div>
              <h1 class="text-center">Register Here!</h1>
              <p class="text-center mb-0">
                Please fill in the form below to create a new account.
              </p>
              <form
                action=""
                th:action="@{/do_register}"
                method="post"
                th:object="${user}"
              >
                <!-- Your Name -->
                <div class="mb-2">
                  <label for="name-field" class="form-label">Your Name</label>
                  <input
                    name="name"
                    type="text"
                    class="form-control"
                    id="name-field"
                    required
                    th:value="${user.name}"
                  />
                </div>
                <!-- Email -->
                <div class="mb-2">
                  <label for="email-field" class="form-label">Email</label>
                  <input
                    name="email"
                    type="email"
                    class="form-control"
                    id="email-field"
                    required
                    th:value="${user.email}"
                  />
                  <div class="invalid-feedback mb-2">
                    Please enter a valid email address.
                  </div>
                  <div class="valid-feedback mb-2">Looks good!</div>
                  <small id="emailHelp" class="form-text text-muted">
                    We'll never share your email with anyone else.
                  </small>
                </div>
                <!-- Password -->
                <div class="mb-2">
                  <label for="password-field" class="form-label"
                    >Password</label
                  >
                  <input
                    name="password"
                    type="password"
                    class="form-control"
                    id="password-field"
                    required
                  />
                </div>
                <!-- About Field -->
                <div class="form-group mb-2">
                  <textarea
                    name="about"
                    id="about-field"
                    class="form-control"
                    rows="3"
                    th:value="${user.about}"
                    placeholder="Tell us about yourself..."
                  ></textarea>
                </div>
                <!-- Terms and Condition CheckBox -->
                <div class="form-group text-center custom-checkbox-container">
                  <input
                    name="agreement"
                    type="checkbox"
                    class="form-check-input custom-checkbox"
                    id="agreement-checkbox"
                    required
                  />
                  <label class="form-check-label" for="agreement-checkbox">
                    I accept the terms and conditions.
                  </label>
                </div>

                <!-- Submit Button -->
                <div class="signup-btn-container">
                  <button type="submit" class="btn bg-primary text-uppercase">
                    Submit
                  </button>
                  <button type="reset" class="btn bg-primary text-uppercase">
                    Reset
                  </button>
                  <a th:href="@{/}" class="btn bg-primary text-uppercase ms-2"
                    >Home</a
                  >
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
