<!DOCTYPE html>
<html
  lang="en"
  xmlns:th="http://www.thymeleaf.org"
  th:replace="base::layout(~{::section})"
>
  <head>
    <meta charset="UTF-8" />
     <link rel="stylesheet" th:href="@{/css/signup.css}" />
    <title>Smart Contact Manager</title>
  </head>
  <body>
    <!-- <div class="container">
        <h1>Welcome to Smart Contact Manager</h1>
        <p>This is a simple application to manage your contacts.</p>
    </div> -->

    <section class="form-section">
      <h1>Signup Page</h1>
        <p>
          Please fill in the form below to create a new account.
        </p>
        <form action="#" th:action="@{/signup}" method="post">
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control" id="username" name="username" required />
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" name="email" required />
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password" required />
            </div>
            <button type="submit" class="btn btn-primary">Sign Up</button>

        <a href="#" th:href="@{/}">Go back to Home</a>
        <!-- Link to home page -->
      </p>
    </section>
  </body>
</html>
