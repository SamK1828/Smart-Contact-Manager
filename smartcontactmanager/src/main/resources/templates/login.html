<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: layout(~{::section})}">
  <body>
    <section class="page-section auth-section">
      <div class="container auth-container">
        <div class="surface-card auth-card">
          <span class="eyebrow">Welcome back</span>
          <h1 class="page-title">Sign in to your space.</h1>
          <p class="text-secondary mb-4">Your contact book is right where you left it.</p>

          <div class="alert alert-success" role="status" th:if="${registered}">
            Your account is ready. Sign in to continue.
          </div>
          <div class="alert alert-danger" role="alert" th:if="${loginError}">
            We couldn't sign you in with those details. Please try again.
          </div>
          <div class="alert alert-info" role="status" th:if="${loggedOut}">
            You have been signed out.
          </div>

          <form th:action="@{/do_login}" method="post">
            <div class="mb-3">
              <label for="email-field" class="form-label">Email address</label>
              <input
                type="email"
                name="email"
                class="form-control"
                id="email-field"
                autocomplete="username"
                required
              />
            </div>
            <div class="mb-4">
              <label for="password-field" class="form-label">Password</label>
              <input
                type="password"
                name="password"
                class="form-control"
                id="password-field"
                autocomplete="current-password"
                required
              />
            </div>
            <button type="submit" class="btn btn-primary w-100">Sign in</button>
          </form>
          <p class="text-secondary text-center mt-4 mb-0">
            New here? <a th:href="@{/signup}">Create an account</a>
          </p>
        </div>
      </div>
    </section>
  </body>
</html>
