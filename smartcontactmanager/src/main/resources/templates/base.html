<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content)">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f7fb" />
    <title th:text="${title} ?: 'Smart Contact Manager'">Smart Contact Manager</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" th:href="@{/css/style.css}" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg app-navbar">
      <div class="container">
        <a class="navbar-brand brand-mark" th:href="@{/}">
          <span class="brand-icon" aria-hidden="true">S</span>
          <span>smart<span class="brand-light">contacts</span></span>
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#mainNavigation"
          aria-controls="mainNavigation"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNavigation">
          <div class="navbar-nav ms-auto align-items-lg-center gap-lg-2 py-3 py-lg-0">
            <a class="nav-link" th:href="@{/about}">About</a>
            <a
              class="nav-link"
              th:if="${authenticatedEmail != null}"
              th:href="@{/user/dashboard}"
            >My contacts</a>
            <a
              class="nav-link"
              th:if="${authenticatedEmail != null}"
              th:href="@{/user/profile}"
            >Profile</a>
            <a
              class="nav-link"
              th:if="${authenticatedEmail != null}"
              th:href="@{/user/settings}"
            >Settings</a>
            <a class="nav-link" th:if="${authenticatedEmail == null}" th:href="@{/login}">Sign in</a>
            <a
              class="btn btn-sm btn-primary-soft"
              th:if="${authenticatedEmail == null}"
              th:href="@{/signup}"
            >Create account</a>
            <form
              th:if="${authenticatedEmail != null}"
              th:action="@{/logout}"
              method="post"
              class="m-0"
            >
              <button class="btn btn-sm btn-outline-secondary" type="submit">Sign out</button>
            </form>
          </div>
        </div>
      </div>
    </nav>

    <main th:replace="${content}"></main>

    <footer class="app-footer">
      <div class="container d-flex flex-column flex-sm-row justify-content-between gap-2">
        <span>Keep the people who matter, close.</span>
        <span>&copy; <span th:text="${#temporals.format(#temporals.createNow(), 'yyyy')}">2026</span> Smart Contacts</span>
      </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
