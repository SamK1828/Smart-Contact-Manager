<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: layout(~{::section})}">
  <body>
    <section class="page-section">
      <div class="container form-container">
        <a class="back-link" th:href="@{/user/dashboard}">← Back to contacts</a>
        <div class="surface-card form-card mt-3">
          <span class="eyebrow">Contact details</span>
          <h1 class="page-title" th:text="${heading}">Add a contact</h1>
          <form th:action="${formAction}" th:object="${contactForm}" method="post" class="mt-4">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label" for="contactName">First name</label>
                <input class="form-control" id="contactName" th:field="*{contactName}"
                  th:classappend="${#fields.hasErrors('contactName')} ? 'is-invalid' : ''" required />
                <div class="invalid-feedback" th:errors="*{contactName}"></div>
              </div>
              <div class="col-md-6">
                <label class="form-label" for="secondName">Last name</label>
                <input class="form-control" id="secondName" th:field="*{secondName}"
                  th:classappend="${#fields.hasErrors('secondName')} ? 'is-invalid' : ''" />
                <div class="invalid-feedback" th:errors="*{secondName}"></div>
              </div>
              <div class="col-md-6">
                <label class="form-label" for="phone">Phone</label>
                <input class="form-control" id="phone" type="tel" th:field="*{phone}"
                  th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid' : ''"
                  autocomplete="tel" required />
                <div class="invalid-feedback" th:errors="*{phone}"></div>
              </div>
              <div class="col-md-6">
                <label class="form-label" for="work">Workplace</label>
                <input class="form-control" id="work" th:field="*{work}"
                  th:classappend="${#fields.hasErrors('work')} ? 'is-invalid' : ''" />
                <div class="invalid-feedback" th:errors="*{work}"></div>
              </div>
              <div class="col-12">
                <label class="form-label" for="tags">Tags</label>
                <input class="form-control" id="tags" th:field="*{tags}"
                  th:classappend="${#fields.hasErrors('tags')} ? 'is-invalid' : ''"
                  placeholder="Work, family, clients" aria-describedby="tagsHelp" />
                <div class="form-text" id="tagsHelp">Separate tags with commas.</div>
                <div class="invalid-feedback" th:errors="*{tags}"></div>
              </div>
              <div class="col-12">
                <label class="form-label" for="description">Notes</label>
                <textarea class="form-control" id="description" rows="4" th:field="*{description}"
                  th:classappend="${#fields.hasErrors('description')} ? 'is-invalid' : ''"
                  maxlength="1000"></textarea>
                <div class="invalid-feedback" th:errors="*{description}"></div>
              </div>
            </div>
            <div class="d-flex flex-wrap gap-2 mt-4">
              <button class="btn btn-primary" type="submit">Save contact</button>
              <a class="btn btn-outline-secondary" th:href="@{/user/dashboard}">Cancel</a>
            </div>
          </form>
        </div>
      </div>
    </section>
  </body>
</html>
