spring.application.name=smartcontactmanager
server.port=8282
# Database Configuration
# Ensure you have the MySQL Connector dependency in your pom.xml or build.gradle
spring.datasource.url=jdbc:mysql://localhost:3307/smartcontactmanager?serverTimezone=UTC
# Ensure the port matches your MySQL server configuration
spring.datasource.username=root
spring.datasource.password=root
# MySQL Driver Configuration
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
# # Hibernate Configuration
# spring.jpa.show-sql=true
# spring.jpa.properties.hibernate.format_sql=true
spring.thymeleaf.check-template-location=false
# # CORS Configuration
# # Thymeleaf Configuration
# spring.thymeleaf.cache=false
# # Logging Configuration
# logging.level.org.springframework.web=DEBUG
# Show DDL statements like create table
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.tool.hbm2ddl=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE